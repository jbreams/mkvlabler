<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mkvlabel</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg:       #0d0d0d;
        --surface:  #161616;
        --surface2: #1f1f1f;
        --surface3: #2a2a2a;
        --border:   #2e2e2e;
        --accent:   #f4a429;
        --accent2:  #3b82f6;
        --green:    #22c55e;
        --red:      #ef4444;
        --text:     #e8e8e8;
        --muted:    #6b6b6b;
        --mono:     'IBM Plex Mono', monospace;
        --sans:     'IBM Plex Sans', sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      header h1 {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: -0.5px;
      }
      .dir-row { display: flex; flex: 1; gap: 6px; align-items: center; }
      .root-prefix {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        flex-shrink: 0;
      }

      input[type=text] {
        flex: 1;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 3px;
        outline: none;
        transition: border-color .15s;
      }
      input[type=text]:focus { border-color: var(--accent); }
      input[type=number] {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        padding: 3px 6px;
        border-radius: 3px;
        outline: none;
        width: 60px;
      }
      button {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        padding: 5px 12px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
        transition: all .1s;
      }
      button:hover { background: var(--surface3); border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
      button.primary:hover { background: #ffb84d; }
      button.danger { border-color: var(--red); color: var(--red); }
      button.small { padding: 3px 8px; font-size: 10px; }
      button:disabled { opacity: .4; cursor: not-allowed; }

      .stats-bar {
        display: flex;
        gap: 20px;
        padding: 6px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .stats-bar span { color: var(--text); }

      .main {
        display: grid;
        grid-template-columns: 420px 1fr 320px;
        flex: 1;
        overflow: hidden;
      }

      .panel {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        overflow: hidden;
      }
      .panel-header {
        padding: 8px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
      }
      .panel-body { flex: 1; overflow-y: auto; }
      .panel-footer {
        padding: 8px 12px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .file-group { border-bottom: 1px solid var(--border); }
      .file-group-header {
        padding: 6px 12px;
        background: var(--surface2);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cluster-badge {
        background: var(--accent);
        color: #000;
        font-size: 9px;
        font-weight: 600;
        padding: 1px 5px;
        border-radius: 2px;
      }
      .file-item {
        padding: 7px 12px;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition: all .1s;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .file-item:hover { background: var(--surface2); }
      .file-item.selected { border-left-color: var(--accent); background: rgba(244,164,41,.06); }
      .file-item.mapped { border-left-color: var(--green); }
      .file-info { flex: 1; min-width: 0; }
      .file-name {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file-item.mapped .file-name { color: var(--muted); text-decoration: line-through; }
      .file-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
      .file-mapped-label {
        font-size: 10px;
        color: var(--green);
        font-family: var(--mono);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file-actions { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }

      .center { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
      .selected-file-info {
        padding: 12px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .selected-file-info h3 {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .props-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px 12px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
      }
      .props-grid strong { color: var(--text); }

      .preview-player {
        background: #000;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
      }
      .preview-player video {
        width: 100%;
        display: block;
        max-height: 220px;
        object-fit: contain;
        background: #000;
      }
      .preview-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .preview-controls label { font-family: var(--mono); font-size: 10px; color: var(--muted); }

      .mapping-area { flex: 1; overflow-y: auto; padding: 12px 14px; }
      .current-mapping {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .current-mapping label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
      .current-mapping .mapped-to { font-family: var(--mono); font-size: 12px; color: var(--green); margin-top: 4px; }

      .quick-assign { margin-bottom: 12px; }
      .quick-assign h4 { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
      .assign-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
      .assign-btn { text-align: left; padding: 5px 8px; font-size: 10px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .search-section { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .search-row { display: flex; gap: 6px; margin-bottom: 8px; }
      .search-row input { flex: 1; }
      .tab-bar { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .tab { padding: 6px 10px; font-family: var(--mono); font-size: 10px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .1s; }
      .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
      .tab:hover { color: var(--text); }
      .metadata-results { flex: 1; overflow-y: auto; padding: 8px 0; }

      .result-item { padding: 7px 12px; cursor: pointer; border-left: 3px solid transparent; transition: all .1s; }
      .result-item:hover { background: var(--surface2); border-left-color: var(--accent2); }
      .result-item.active { background: rgba(59,130,246,.08); border-left-color: var(--accent2); }
      .result-title-row { display: flex; align-items: center; gap: 6px; }
      .result-title { font-family: var(--mono); font-size: 11px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .result-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
      .source-badge { font-family: var(--mono); font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 2px; flex-shrink: 0; letter-spacing: .3px; }
      .source-tv    { background: rgba(59,130,246,.18); color: var(--accent2); }
      .source-movie { background: rgba(244,164,41,.18);  color: var(--accent); }

      .episode-item { padding: 5px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background .1s; }
      .episode-item:hover { background: var(--surface2); }
      .ep-code { font-family: var(--mono); font-size: 10px; color: var(--accent2); flex-shrink: 0; width: 64px; }
      .ep-title { font-family: var(--mono); font-size: 11px; flex: 1; }
      .ep-runtime { font-family: var(--mono); font-size: 10px; color: var(--muted); }

      .rename-panel { border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; max-height: 200px; overflow-y: auto; }
      .rename-item { padding: 5px 14px; font-family: var(--mono); font-size: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
      .rename-old { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rename-new { color: var(--green); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 11px; line-height: 1.8; }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      .season-row { display: flex; gap: 6px; align-items: center; }
      .season-row label { font-family: var(--mono); font-size: 10px; color: var(--muted); }
      .season-row input[type=number] { width: 50px; }
    </style>
  </head>
  <body></body>
</html>
